# robot.yaml — logical description of the 6-DOF arm.
#
# Values mirror urdf/robot_arm.urdf. This file is the single source of truth for
# code that needs joint names, ordering, limits, and named poses. If the URDF
# changes, update this file to match (limits are in radians; effort in N·m;
# velocity in rad/s, straight from the URDF <limit> tags).

name: robot_arm_6dof

# Driven joints in kinematic (base -> tool) order. The DOF order the Isaac Sim
# articulation reports should match this list; scripts assert it on load.
joints:
  - name: j1_joint
    link: j1_link
    axis: [0, 0, 1]
    lower: -4.712389
    upper: 4.712389
    effort: 30.0
    velocity: 3.14
    actuator: hoverboard     # J1 — hoverboard hub motor

  - name: j2_joint
    link: j2_link
    axis: [0, -1, 0]
    lower: -1.047198
    upper: 2.181662
    effort: 45.0
    velocity: 2.0
    actuator: hoverboard     # J2 — hoverboard hub motor

  - name: j3_joint
    link: j3_link
    axis: [0, -1, 0]
    lower: -2.007129
    upper: 2.007129
    effort: 20.0
    velocity: 1.3
    actuator: servo

  - name: j4_joint
    link: j4_link
    axis: [1, 0, 0]
    lower: -2.617994
    upper: 2.617994
